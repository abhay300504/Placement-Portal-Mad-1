{% extends 'layout_dashboard.html' %}
{% block title %}Edit Company Profile{% endblock %}

{% block sidebar %}
  <div class="sidebar-section">Overview</div>
  <a href="{{ url_for('company_dashboard') }}" class="sidebar-link"><i class="bi bi-grid-fill"></i> Dashboard</a>
  <div class="sidebar-section">Drives</div>
  <a href="{{ url_for('company_drives') }}" class="sidebar-link"><i class="bi bi-briefcase"></i> My Drives</a>
  <a href="{{ url_for('company_create_drive') }}" class="sidebar-link"><i class="bi bi-plus-circle"></i> Create Drive</a>
  <div class="sidebar-section">Account</div>
  <a href="{{ url_for('company_edit_profile') }}" class="sidebar-link active"><i class="bi bi-pencil"></i> Edit Profile</a>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="page-header">
      <h1>Edit Company Profile</h1>
    </div>
    <div class="card">
      <div class="card-body">
        <form method="POST" action="{{ url_for('company_edit_profile') }}">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Company Name</label>
              <input type="text" name="company_name" class="form-control" value="{{ company.company_name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">HR Contact Name</label>
              <input type="text" name="hr_contact" class="form-control" value="{{ company.hr_contact or '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone Number</label>
              <input type="tel" name="phone" class="form-control" value="{{ company.phone or '' }}">
            </div>
            <div class="col-12">
              <label class="form-label">Website</label>
              <input type="url" name="website" class="form-control" value="{{ company.website or '' }}">
            </div>
            <div class="col-12">
              <label class="form-label">Company Description</label>
              <textarea name="description" class="form-control" rows="4">{{ company.description or '' }}</textarea>
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>Save Changes
            </button>
            <a href="{{ url_for('company_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
