{% extends 'layout_dashboard.html' %}
{% block title %}Edit Student{% endblock %}

{% block sidebar %}
  <div class="sidebar-section">Overview</div>
  <a href="{{ url_for('admin_dashboard') }}" class="sidebar-link"><i class="bi bi-grid-fill"></i> Dashboard</a>
  <div class="sidebar-section">Manage</div>
  <a href="{{ url_for('admin_companies') }}" class="sidebar-link"><i class="bi bi-building"></i> Companies</a>
  <a href="{{ url_for('admin_students') }}" class="sidebar-link active"><i class="bi bi-people"></i> Students</a>
  <a href="{{ url_for('admin_drives') }}" class="sidebar-link"><i class="bi bi-briefcase"></i> Drives</a>
  <a href="{{ url_for('admin_applications') }}" class="sidebar-link"><i class="bi bi-file-earmark-text"></i> Applications</a>
  <div class="sidebar-section">Tools</div>
  <a href="{{ url_for('admin_search') }}" class="sidebar-link"><i class="bi bi-search"></i> Search</a>
{% endblock %}

{% block content %}
<div class="mb-3">
  <a href="{{ url_for('admin_student_detail', student_id=student.id) }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Back
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header">
        <span><i class="bi bi-pencil me-2 text-muted"></i>Edit Student — {{ student.full_name }}</span>
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('admin_edit_student', student_id=student.id) }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" name="full_name" class="form-control" value="{{ student.full_name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" value="{{ student.email }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" name="phone" class="form-control" value="{{ student.phone or '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Branch</label>
              <input type="text" name="branch" class="form-control" value="{{ student.branch or '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Year</label>
              <select name="year" class="form-select">
                {% for yr in ['1st Year','2nd Year','3rd Year','4th Year'] %}
                <option value="{{ yr }}" {{ 'selected' if student.year == yr }}>{{ yr }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">CGPA</label>
              <input type="number" step="0.01" min="0" max="10" name="cgpa"
                     class="form-control" value="{{ student.cgpa or '' }}">
            </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>Save Changes
            </button>
            <a href="{{ url_for('admin_student_detail', student_id=student.id) }}"
               class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
